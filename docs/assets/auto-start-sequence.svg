<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img" aria-labelledby="t d">
<title id="t">Auto-start sequence</title>
<desc id="d">While the VM is down, the proxy answers pings itself. The first real request makes ColimaModel run colima start, wait for readiness probes, and then the proxy splices the request to Colima on the same connection.</desc>

<style>
  :root {
    --bg: #ffffff; --edge: #d1d9e0; --panel: #f6f8fa; --box: #ffffff; --stroke: #d1d9e0;
    --text: #1f2328; --muted: #59636e; --line: #818b98;
    --accent: #0969da; --accent-bg: #ddf4ff; --green: #1a7f37; --green-bg: #dafbe1;
    --amber: #9a6700; --amber-bg: #fff8c5; --purple: #8250df; --purple-bg: #fbefff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --edge: #3d444d; --panel: #151b23; --box: #0d1117; --stroke: #3d444d;
      --text: #f0f6fc; --muted: #9198a1; --line: #656c76;
      --accent: #4493f8; --accent-bg: #0f2a4d; --green: #3fb950; --green-bg: #12301b;
      --amber: #d29922; --amber-bg: #3a2c05; --purple: #ab7df8; --purple-bg: #2b1b4a;
    }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: var(--text); }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  .title { font-size: 20px; font-weight: 600; }
  .sub { font-size: 13px; fill: var(--muted); }
  .h { font-size: 12px; font-weight: 600; letter-spacing: .06em; fill: var(--muted); }
  .b { font-size: 14px; font-weight: 600; }
  .s { font-size: 12px; fill: var(--muted); }
  .xs { font-size: 12px; fill: var(--muted); }
  .card { fill: var(--bg); stroke: var(--edge); }
  .panel { fill: var(--panel); stroke: var(--stroke); }
  .box { fill: var(--box); stroke: var(--stroke); }
  .key { fill: var(--accent-bg); stroke: var(--accent); }
  .vm { fill: var(--green-bg); stroke: var(--green); }
  .tool { fill: var(--amber-bg); stroke: var(--amber); }
  .ui { fill: var(--purple-bg); stroke: var(--purple); }
  .flow { stroke: var(--accent); stroke-width: 2; fill: none; }
  .ctl { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .dash { stroke-dasharray: 5 4; }
  .head-flow { fill: var(--accent); }
  .head-ctl { fill: var(--line); }
  .accent { fill: var(--accent); }
  .green { fill: var(--green); }
  .life { stroke: var(--stroke); stroke-width: 1.5; stroke-dasharray: 4 5; }
  .gate { fill: var(--amber-bg); stroke: var(--amber); stroke-dasharray: 5 4; }
  .num { fill: var(--accent); }
  .numt { fill: #ffffff; font-size: 12px; font-weight: 700; }
</style>
<defs>
  <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="head-flow" d="M0,0 L10,5 L0,10 z"/>
  </marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="head-ctl" d="M0,0 L10,5 L0,10 z"/>
  </marker>
</defs>

<rect class="card" x="0.5" y="0.5" width="1039" height="639" rx="14"/>
<text class="title" x="32" y="46" text-anchor="start">Auto-start: the first real request</text>
<text class="sub" x="32" y="68" text-anchor="start">The VM is down. A ping does not start it. A real request does, and then continues on the same connection.</text>
<rect class="gate" x="560" y="318" width="460" height="156" rx="10"/>
<text class="xs" x="1008" y="338" text-anchor="end">readiness gate</text>
<rect class="box" x="40" y="96" width="180" height="44" rx="10"/>
<text class="b" x="130.0" y="123.0" text-anchor="middle">Docker client</text>
<line class="life" x1="130" y1="140" x2="130" y2="616"/>
<rect class="key" x="300" y="96" width="180" height="44" rx="10"/>
<text class="b" x="390.0" y="123.0" text-anchor="middle">SocketProxy</text>
<line class="life" x1="390" y1="140" x2="390" y2="616"/>
<rect class="box" x="560" y="96" width="180" height="44" rx="10"/>
<text class="b" x="650.0" y="123.0" text-anchor="middle">ColimaModel</text>
<line class="life" x1="650" y1="140" x2="650" y2="616"/>
<rect class="vm" x="820" y="96" width="180" height="44" rx="10"/>
<text class="b" x="910.0" y="123.0" text-anchor="middle">Colima VM</text>
<line class="life" x1="910" y1="140" x2="910" y2="616"/>
<path class="flow" d="M134,180 L388,180" marker-end="url(#af)"/>
<text class="s mono" x="260.0" y="171" text-anchor="middle">HEAD /_ping</text>
<circle class="num" cx="146" cy="167" r="9"/>
<text class="numt" x="146" y="171" text-anchor="middle">1</text>
<path class="ctl dash" d="M386,222 L132,222" marker-end="url(#ac)"/>
<text class="s mono" x="260.0" y="213" text-anchor="middle">200 OK</text>
<circle class="num" cx="374" cy="209" r="9"/>
<text class="numt" x="374" y="213" text-anchor="middle">2</text>
<text class="xs" x="260.0" y="239" text-anchor="middle">answered by the proxy, the VM stays down</text>
<path class="flow" d="M134,280 L388,280" marker-end="url(#af)"/>
<text class="s mono" x="260.0" y="271" text-anchor="middle">POST /containers/create</text>
<circle class="num" cx="146" cy="267" r="9"/>
<text class="numt" x="146" y="271" text-anchor="middle">3</text>
<path class="ctl" d="M394,306 L648,306" marker-end="url(#ac)"/>
<text class="s mono" x="520.0" y="297" text-anchor="middle">wakeForProxy()</text>
<circle class="num" cx="406" cy="293" r="9"/>
<text class="numt" x="406" y="297" text-anchor="middle">4</text>
<path class="ctl" d="M654,360 L908,360" marker-end="url(#ac)"/>
<text class="s mono" x="780.0" y="351" text-anchor="middle">colima start</text>
<circle class="num" cx="666" cy="347" r="9"/>
<text class="numt" x="666" y="351" text-anchor="middle">5</text>
<path class="ctl dash" d="M906,400 L652,400" marker-end="url(#ac)"/>
<text class="s mono" x="780.0" y="391" text-anchor="middle">exit 0</text>
<circle class="num" cx="894" cy="387" r="9"/>
<text class="numt" x="894" y="391" text-anchor="middle">6</text>
<path class="ctl" d="M654,440 L908,440" marker-end="url(#ac)"/>
<text class="s mono" x="780.0" y="431" text-anchor="middle">GET /images/json  × N</text>
<circle class="num" cx="666" cy="427" r="9"/>
<text class="numt" x="666" y="431" text-anchor="middle">7</text>
<text class="xs" x="780.0" y="457" text-anchor="middle">several successes in a row</text>
<path class="ctl dash" d="M646,506 L392,506" marker-end="url(#ac)"/>
<text class="s mono" x="520.0" y="497" text-anchor="middle">ready</text>
<circle class="num" cx="634" cy="493" r="9"/>
<text class="numt" x="634" y="497" text-anchor="middle">8</text>
<path class="flow" d="M394,540 L908,540" marker-end="url(#af)"/>
<text class="s" x="650.0" y="531" text-anchor="middle">the waiting request, spliced</text>
<circle class="num" cx="406" cy="527" r="9"/>
<text class="numt" x="406" y="531" text-anchor="middle">9</text>
<path class="flow dash" d="M906,590 L132,590" marker-end="url(#af)"/>
<text class="s" x="520.0" y="581" text-anchor="middle">response through the proxy</text>
<circle class="num" cx="894" cy="577" r="9"/>
<text class="numt" x="894" y="581" text-anchor="middle">10</text>
<text class="xs" x="520.0" y="607" text-anchor="middle">same connection</text>
</svg>

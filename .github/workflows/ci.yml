name: CI

# macOS runner minutes count 10x on private repos, so this runs on pushes to
# main, pull requests and release tags only, and cancels superseded runs.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # create releases on tags

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe for the version

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build app
        run: ./build.sh

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: ditto -c -k --keepParent build/ColimaBar.app "ColimaBar-${GITHUB_REF_NAME}.zip"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "ColimaBar-${GITHUB_REF_NAME}.zip" \
            --title "ColimaBar $GITHUB_REF_NAME" --generate-notes

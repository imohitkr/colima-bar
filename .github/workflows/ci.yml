name: CI

# macOS runner minutes count 10x on private repos, so this runs on pushes to
# main, pull requests and release tags only, and cancels superseded runs.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Only the release job gets write access.
permissions:
  contents: read

# The exact Swift.org toolchain for the macOS jobs. GitHub's Xcode images do not
# have it yet. If you change it, also change the swift image tag in the lint job.
env:
  SWIFT_VERSION: 6.4.0
  # Package.swift: use the testing macro plugin of the Swift.org toolchain, not
  # the one of the Command Line Tools, which can be newer on the runner image.
  COLIMABAR_TOOLCHAIN_PLUGINS: "1"

# Actions are pinned to full commit SHAs, so a moved tag cannot change them.
jobs:
  # Tests and the release build run in parallel jobs. Each compiles the
  # package once (debug or release), so neither waits for the other.
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs Swift $SWIFT_VERSION with swiftly and fails on any other version.
      - uses: ./.github/actions/setup-swift
        with:
          version: ${{ env.SWIFT_VERSION }}

      # The key has the commit, so each run saves a fresh .build and the next
      # run restores the newest one by prefix. Tag builds start clean, so a
      # poisoned cache cannot reach a release.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          path: .build
          key: spm-debug-${{ runner.os }}-swift-${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-debug-${{ runner.os }}-swift-${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-

      - name: Test
        run: swift test

  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # git describe for the version
          persist-credentials: false

      - uses: ./.github/actions/setup-swift
        with:
          version: ${{ env.SWIFT_VERSION }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          path: .build
          key: spm-release-${{ runner.os }}-swift-${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-release-${{ runner.os }}-swift-${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-

      - name: Build app
        run: ./build.sh

      # Only the test build of the in-app update has the hook that moves the
      # update check to a local server. A release build must not have it.
      - name: No update test hook in the build
        run: |
          if grep -aq COLIMABAR_UPDATE_BASE build/ColimaBar.app/Contents/MacOS/ColimaBar; then
            echo "The binary has the update test hook." >&2
            exit 1
          fi

      # The signature must seal the `colimabar` command. The command must run
      # and print the version of the Info.plist.
      - name: Signature and command of the build
        run: |
          codesign --verify --deep --strict build/ColimaBar.app
          expected=$(plutil -extract CFBundleShortVersionString raw -o - build/ColimaBar.app/Contents/Info.plist)
          actual=$(build/ColimaBar.app/Contents/Resources/bin/colimabar version)
          if [ "$actual" != "colimabar $expected" ]; then
            echo "colimabar version printed '$actual', not 'colimabar $expected'." >&2
            exit 1
          fi

  # The same Swift format check as `make lint`. The rules are in .swift-format.
  # The official Swift image on Linux costs less than a macOS runner.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      # Dependabot cannot update this image. To update it, change the tag to
      # the new SWIFT_VERSION and the digest to the multi-arch index digest from
      # `docker buildx imagetools inspect swift:<version>`.
      image: swift:6.4.0@sha256:4601bf61dab9485a3e93087770b72d268737e945a5b000e2286b6cc48bb048b6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: swift --version

      - name: swift-format
        run: swift format lint --strict --recursive Sources Tests Package.swift

  # ShellCheck for the shell scripts, and actionlint for the workflows. The
  # actionlint image also runs ShellCheck on each `run:` block.
  scripts-and-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Dependabot cannot update images in `docker run`. To update one, change
      # the tag and the digest here and in the Makefile. Use the multi-arch
      # index digest from `docker buildx imagetools inspect <image>:<tag>`.
      SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
      ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: |
          docker run --rm "$SHELLCHECK_IMAGE" --version
          docker run --rm -v "$PWD:/src:ro" -w /src "$SHELLCHECK_IMAGE" scripts/*.sh build.sh

      - name: actionlint
        run: |
          docker run --rm "$ACTIONLINT_IMAGE" -version
          docker run --rm -v "$PWD:/src:ro" -w /src "$ACTIONLINT_IMAGE" -color

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, lint, scripts-and-workflows]
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write       # create the release
      id-token: write       # sign the provenance attestation
      attestations: write   # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # git describe for the version
          persist-credentials: false

      - uses: ./.github/actions/setup-swift
        with:
          version: ${{ env.SWIFT_VERSION }}

      # Stable asset names, so releases/latest/download/ColimaBar.{dmg,zip}
      # always points at the newest version (install.sh and the README use it).
      - name: Package
        run: |
          ./build.sh dmg
          cp build/ColimaBar-*.dmg ColimaBar.dmg
          ditto -c -k --keepParent build/ColimaBar.app ColimaBar.zip
          if grep -aq COLIMABAR_UPDATE_BASE build/ColimaBar.app/Contents/MacOS/ColimaBar; then
            echo "The binary has the update test hook." >&2
            exit 1
          fi

      # Lets users check a download with
      # `gh attestation verify ColimaBar.zip --repo imohitkr/colima-bar`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ColimaBar.dmg
            ColimaBar.zip

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Immutable releases: a published release cannot change. Upload the
        # assets to a draft first, then publish it.
        run: |
          gh release create "$GITHUB_REF_NAME" ColimaBar.dmg ColimaBar.zip \
            --title "ColimaBar $GITHUB_REF_NAME" --generate-notes --draft
          gh release edit "$GITHUB_REF_NAME" --draft=false

      # In-app updates trust the digest that GitHub lists for each asset, and
      # only an immutable release keeps its files. Check both after publish.
      - name: Check the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          immutable=$(gh api "repos/$GH_REPO/releases/tags/$GITHUB_REF_NAME" --jq '.immutable')
          if [ "$immutable" != true ]; then
            echo "The release is not immutable." >&2
            exit 1
          fi
          for f in ColimaBar.dmg ColimaBar.zip; do
            listed=$(gh api "repos/$GH_REPO/releases/tags/$GITHUB_REF_NAME" \
              --jq ".assets[] | select(.name == \"$f\") | .digest")
            local_digest="sha256:$(shasum -a 256 "$f" | cut -d ' ' -f 1)"
            if [ "$listed" != "$local_digest" ]; then
              echo "The digest of $f on GitHub ($listed) is not the digest of the built file ($local_digest)." >&2
              exit 1
            fi
          done

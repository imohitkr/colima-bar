# Opens pull requests when a new version of a SHA-pinned action is available.
# ColimaBar has no package dependencies, so only GitHub Actions is listed.
# Dependabot cannot update the Docker images in ci.yml (a job `container:`
# and `docker run` lines). Comments in ci.yml say how to update them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait 7 days after an action release before a pull request opens.
    # A bad release is often found and pulled in that time.
    cooldown:
      default-days: 7

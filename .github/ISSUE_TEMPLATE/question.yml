name: Question
description: Ask how to do something with ColimaBar.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Read the [user guides](https://github.com/imohitkr/colima-bar/blob/main/docs/README.md) and search the open issues first. The answer can already be there.
        If something does not work as the docs describe, use the bug report form instead.
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: Tell us what you did. Add the commands that you ran, if any.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Tell us what you wanted to happen.
    validations:
      required: true
  - type: input
    id: colimabar
    attributes:
      label: ColimaBar version
      description: The dashboard footer and the right-click menu show the version.
      placeholder: "0.4.0"
    validations:
      required: true
